# Production compose. Jenkins runs it on oracle with docker-compose.oracle.yml layered on top
# (COMPOSE_PROJECT_NAME=portfolio). Secrets come from ./.env in the Jenkins workspace, never the repo.
#
# Resource budget on the shared oracle host (caps, not reservations):
#   web 0.8 CPU / 640m, postgres 0.5 CPU / 512m, renderer 0.5 CPU / 512m, worker 0.25 CPU / 256m,
#   backup 0.25 CPU / 256m = 2.3 CPU / 2.2 GB at most. The renderer, worker and backup sit idle
#   except for a few seconds per publication (one PDF at a time) or per day (the dump), so the
#   steady load stays near web + postgres.
name: portfolio

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: portfolio-web:latest
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18091}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Hits /api/health (which round-trips to Postgres) with the first allowed host as Host header.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u;h=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip();u.urlopen(u.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}),timeout=5)"
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    cpus: 0.8
    mem_limit: 640m
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-portfolio}
      POSTGRES_USER: ${POSTGRES_USER:-portfolio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

  # Revision PDF jobs (#40): same image as web, one job at a time (`manage.py pdf_worker`).
  worker:
    image: portfolio-web:latest
    pull_policy: never  # built by `compose build web`
    command: ["python", "manage.py", "pdf_worker"]
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 2m  # SIGTERM lets the current PDF finish
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped

  # Daily DB backup (#19): same image (it carries pg_dump 17), wakes every few minutes and dumps
  # once per 04:00 KST to the private bucket's `backups/`, then drops copies older than 30 days.
  # Idle almost always; pg_dump of this small DB takes seconds. Restore: docs/ops/backup-restore.md.
  backup:
    image: portfolio-web:latest
    pull_policy: never  # built by `compose build web`
    command: ["python", "manage.py", "db_backup"]
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy
    stop_grace_period: 1m
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped

  # The project's own headless Chromium for PDFs (#40). Not the shared browserless on the host:
  # this one is reachable only on the compose network (no host port) and needs a token.
  # The tag is pinned (same as the shared one); the image is multi-arch (amd64, arm64).
  renderer:
    image: ghcr.io/browserless/chromium:v2.30.0
    environment:
      TOKEN: ${PDF_RENDERER_TOKEN:-}
      CONCURRENT: "1"
      QUEUED: "2"
      TIMEOUT: "150000"
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped

volumes:
  pgdata:
