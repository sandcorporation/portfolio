# Production compose. Jenkins runs it on oracle with docker-compose.oracle.yml layered on top
# (COMPOSE_PROJECT_NAME=portfolio). Secrets come from ./.env in the Jenkins workspace, never the repo.
#
# The database is not in this file (#63): it is the OCI MySQL HeatWave instance on the VCN's
# private network, and web and worker reach it through DB_HOST/DB_PORT/DB_NAME/DB_USER/
# DB_PASSWORD in .env. `make prod-local` layers docker-compose.local.yml on top for a local MySQL.
#
# Resource budget on the shared oracle host (caps, not reservations):
#   web 0.8 CPU / 640m, renderer 0.5 CPU / 512m, worker 0.25 CPU / 256m
#   = 1.55 CPU / 1.4 GB at most. The renderer and worker sit idle except for a few seconds
#   per publication (one PDF at a time), so the steady load stays near web.
name: portfolio

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    # 운영(oracle)은 Jenkins가 PORTFOLIO_IMAGE로 ghcr의 <커밋 sha> 이미지를 준다(#165). 없으면 로컬에서 빌드한다.
    image: ${PORTFOLIO_IMAGE:-portfolio-web:latest}
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
      # GlitchTip (issue 235): release = the sha tag of this image; DSNs from .env (empty = off).
      PORTFOLIO_IMAGE: ${PORTFOLIO_IMAGE:-}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
      SENTRY_DSN_FRONTEND: ${SENTRY_DSN_FRONTEND:-}
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-18091}:8000"
    # Hits /api/health (which round-trips to the database) with the first allowed host as Host header.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,urllib.request as u;h=os.environ.get('DJANGO_ALLOWED_HOSTS','localhost').split(',')[0].strip();u.urlopen(u.Request('http://127.0.0.1:8000/api/health',headers={'Host':h}),timeout=5)"
      interval: 60s
      timeout: 6s
      retries: 3
      start_period: 60s
      start_interval: 2s
    cpus: 0.8
    mem_limit: 640m
    restart: unless-stopped

  # Revision PDF jobs (#40): same image as web, one job at a time (`manage.py pdf_worker`).
  worker:
    image: ${PORTFOLIO_IMAGE:-portfolio-web:latest}
    pull_policy: never  # web과 같은 이미지: deploy.sh가 pull(운영) 또는 build(로컬)로 이미 받아 둔다
    command: ["python", "manage.py", "pdf_worker"]
    env_file: [.env]
    environment:
      DJANGO_DEBUG: "0"
      PORTFOLIO_IMAGE: ${PORTFOLIO_IMAGE:-}
      SENTRY_DSN: ${SENTRY_DSN_BACKEND:-}
    stop_grace_period: 2m  # SIGTERM lets the current PDF finish
    cpus: 0.25
    mem_limit: 256m
    restart: unless-stopped

  # The project's own headless Chromium for PDFs (#40). Not the shared browserless on the host:
  # this one is reachable only on the compose network (no host port) and needs a token.
  # The tag is pinned (same as the shared one); the image is multi-arch (amd64, arm64).
  renderer:
    image: ghcr.io/browserless/chromium:v2.30.0
    environment:
      TOKEN: ${PDF_RENDERER_TOKEN:-}
      CONCURRENT: "1"
      QUEUED: "2"
      TIMEOUT: "150000"
    cpus: 0.5
    mem_limit: 512m
    restart: unless-stopped
