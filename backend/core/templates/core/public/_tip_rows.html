{% load public_html %}<ul class="work-list feed-list tip-list">{% for tip in tips %}<li><a class="work-row" href="/tips/{{ tip.slug }}"><span class="work-row-body"><span class="work-row-title">{{ tip.title }} →</span><span class="work-row-meta feed-meta"><time datetime="{{ tip.published_at }}">{{ tip.published_at|post_date }}</time>{% for category in tip.categories %}<span>{{ category.label }}</span>{% endfor %}</span>{% if tip.summary %}<span class="work-row-summary feed-summary">{{ tip.summary }}</span>{% endif %}</span></a></li>{% endfor %}</ul>
