{% load public_html %}<ul class="work-list feed-list">{% for post in posts %}<li><a class="work-row" href="/blog/{{ post.slug }}"><span class="work-row-body"><span class="work-row-title">{{ post.title }} →</span><span class="work-row-meta feed-meta"><time datetime="{{ post.published_at }}">{{ post.published_at|post_date }}</time>{% for tag in post.tags %}<span>{{ tag }}</span>{% endfor %}</span>{% if post.summary %}<span class="work-row-summary feed-summary">{{ post.summary }}</span>{% endif %}</span></a></li>{% endfor %}</ul>
