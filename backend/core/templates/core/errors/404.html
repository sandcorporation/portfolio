<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>페이지를 찾을 수 없습니다 | Sandcorp</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{color-scheme:light dark;--bg:#fff;--fg:#111;--muted:#5b6070;--line:#e3e5ea;--accent:#1e3a8a}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--fg:#f2f3f5;--muted:#9aa0ad;--line:#262a33;--accent:#8fb3ff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;line-height:1.6}
header{border-bottom:1px solid var(--line);padding:1rem 1.5rem}header a{font-family:ui-monospace,Menlo,monospace;font-size:.9rem;letter-spacing:.08em;text-transform:uppercase;color:var(--fg);text-decoration:none;font-weight:700}
main{max-width:40rem;margin:0 auto;padding:6rem 1.5rem}.code{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;letter-spacing:.1em;color:var(--muted)}
h1{font-size:1.75rem;margin:.5rem 0 1rem}p{color:var(--muted);margin:0 0 2rem}main a{color:var(--accent)}
</style>
</head>
<body>
<header><a href="/">Sandcorp</a></header>
<main>
<div class="code">404</div>
<h1>페이지를 찾을 수 없습니다</h1>
<p>주소가 바뀌었거나 없어진 페이지입니다.</p>
<a href="/">홈으로 돌아가기</a>
</main>
</body>
</html>
