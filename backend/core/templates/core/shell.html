{% load static %}<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ meta.title }}</title>
  <meta name="description" content="{{ meta.description }}">
  <meta name="robots" content="{{ meta.robots }}">
  <link rel="canonical" href="{{ canonical }}">
  <meta property="og:title" content="{{ meta.title }}">
  <meta property="og:description" content="{{ meta.description }}">
  <meta property="og:type" content="website">
  {% if og_image %}<meta property="og:image" content="{{ og_image }}">{% endif %}
  <meta property="og:url" content="{{ canonical }}">
  <meta property="og:site_name" content="{{ site_name }}">
  <meta property="og:locale" content="ko_KR">
  <link rel="icon" href="{% static 'core/favicon.svg' %}" type="image/svg+xml">
  <meta name="theme-color" content="#f7f4ee" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#17140f" media="(prefers-color-scheme: dark)">
  {% for href in assets.styles %}<link rel="stylesheet" href="{{ href }}">
  {% endfor %}
  {% if assets.dev_server %}<script type="module">
    import RefreshRuntime from "{{ assets.dev_server }}/@react-refresh";
    RefreshRuntime.injectIntoGlobalHook(window);
    window.$RefreshReg$ = () => {};
    window.$RefreshSig$ = () => (type) => type;
    window.__vite_plugin_react_preamble_installed__ = true;
  </script>{% endif %}
  {% for src in assets.scripts %}<script type="module" src="{{ src }}"></script>
  {% endfor %}
</head>
<body>
  <div id="root"></div>
  {% if data is not None %}{{ data|json_script:"page-data" }}{% endif %}
</body>
</html>
